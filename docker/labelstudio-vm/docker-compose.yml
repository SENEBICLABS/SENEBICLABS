# Production Label Studio for a Google Cloud VM.
# Label Studio + Postgres + Caddy (automatic HTTPS via Let's Encrypt).
# Data lives on the VM's persistent disk (Docker volumes) — your infra, not a third party.

services:
  ls-db:
    image: postgres:15
    environment:
      POSTGRES_DB: labelstudio
      POSTGRES_USER: ls
      POSTGRES_PASSWORD: ${LS_DB_PASSWORD}
    volumes: [ ls-pgdata:/var/lib/postgresql/data ]
    restart: unless-stopped

  label-studio:
    image: heartexlabs/label-studio:latest
    depends_on: [ ls-db ]
    environment:
      DJANGO_DB: default
      POSTGRE_NAME: labelstudio
      POSTGRE_USER: ls
      POSTGRE_PASSWORD: ${LS_DB_PASSWORD}
      POSTGRE_HOST: ls-db
      POSTGRE_PORT: 5432
      LABEL_STUDIO_HOST: https://${LS_DOMAIN}          # public URL clinicians use
      CSRF_TRUSTED_ORIGINS: https://${LS_DOMAIN}        # trust the domain behind the HTTPS proxy
      LABEL_STUDIO_USERNAME: ${LS_ADMIN_EMAIL}          # bootstrap admin (first boot only)
      LABEL_STUDIO_PASSWORD: ${LS_ADMIN_PASSWORD}
      LABEL_STUDIO_DISABLE_SIGNUP_WITHOUT_LINK: "true"  # invite-only — no open signups
    volumes: [ ls-files:/label-studio/data ]
    expose: [ "8080" ]
    restart: unless-stopped

  caddy:
    build:
      context: .
    depends_on: [ label-studio ]
    environment:
      LS_DOMAIN: ${LS_DOMAIN}
    ports: [ "80:80", "443:443" ]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

volumes:
  ls-pgdata:
  ls-files:
  caddy-data:
  caddy-config:

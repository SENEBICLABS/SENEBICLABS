# Render deployment for the API.
#
# The service is stateless. Supabase holds the record, including the clinicians'
# answers, and nothing is written to the container's disk, so it can be
# rebuilt or moved at any time. That property is the point: no host can take the
# platform down for reasons of their own.
#
# Why this host. Bulk ingestion self-triggers: the service posts to its own URL,
# lets the read time out, and relies on the platform to run that request to
# completion. Cloud Run allowed 3600 seconds for it. Render allows HTTP responses
# to take up to 100 minutes, which is more headroom than the pattern needs and
# more than an AWS load balancer's 4000 second maximum.
#
# To deploy: create a Blueprint on Render pointed at this repository, then fill in
# the values marked sync:false in the dashboard. Nothing secret is committed.
services:
  - type: web
    name: senebiclabs-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    # free spins the service down after 15 minutes without a request, so the next
    # caller waits 30 to 60 seconds for a cold start. Fine while nothing is live;
    # move to starter before a client depends on it.
    plan: free
    region: frankfurt          # Render's closest region to Nairobi. Singapore is
                               # closer to India if client latency matters more.
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      # ---- secrets, set in the dashboard -------------------------------------
      # Recover these from the old Cloud Run service while the GCP project still
      # answers. It is deleted on 7 November, and ADMIN_API_KEY exists nowhere
      # else: every client and operator key was derived from it.
      #
      #   gcloud run services describe senebiclabs-api --region us-central1 \
      #     --format='yaml(spec.template.spec.containers[0].env)'
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: ADMIN_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: ANALYSE_ACCESS_TOKEN
        sync: false
      # Carried for parity. Nothing under app/ imports the Anthropic SDK.
      - key: ANTHROPIC_API_KEY
        sync: false

      # Signs the customer portal magic links. On Cloud Run this was unset and
      # fell back to SUPABASE_SERVICE_KEY, so rotating the database key silently
      # invalidated every link already sent. Render generates one on first deploy
      # and then leaves it alone, which decouples the two.
      - key: PORTAL_SECRET
        generateValue: true

      # ---- plain configuration ------------------------------------------------
      - key: ADMIN_EMAIL
        value: support@senebiclabs.com
      - key: FROM_EMAIL
        value: Senebiclabs <noreply@senebiclabs.com>
      - key: SITE_URL
        value: https://senebiclabs.com
      # The marketing site, and the clinician platform, which calls this API.
      - key: CORS_ORIGINS
        value: https://senebiclabs.com,https://www.senebiclabs.com,https://app.senebiclabs.com,https://senebiclabs.vercel.app
      - key: DEBUG
        value: "false"
      # What the service calls to trigger its own background work. Set in the
      # dashboard, not here, because the right value changes during the cutover:
      # the onrender.com hostname until api.senebiclabs.com points at Render, then
      # https://api.senebiclabs.com. Point it at a hostname that does not reach this
      # service and bulk ingest stops triggering with no error anywhere.
      - key: SELF_URL
        sync: false

name: tests

# Every hermetic test runs on every push that touches the code or the tests. Listing
# individual test files here is how the failure-library, regression-gate and webhook
# tests came to exist without CI ever running them; a glob cannot drift that way.
on:
  push:
    paths:
      - "app/**"
      - "scripts/data_quality.py"
      - "tests/**"
      - "supabase_schema.sql"
      - "requirements-ci.txt"
      - ".github/workflows/tests.yml"
  pull_request:
    paths:
      - "app/**"
      - "scripts/data_quality.py"
      - "tests/**"
      - "supabase_schema.sql"
      - "requirements-ci.txt"

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install (lean — no genomics/browser stack)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt
      # Hermetic: no database, no Label Studio, no network. tests/e2e is excluded because
      # it drives a real browser against a running server.
      - name: Unit tests
        run: PYTHONPATH=. pytest -q tests --ignore=tests/e2e

name: tests

on:
  push:
    paths:
      - "app/**"
      - "scripts/data_quality.py"
      - "tests/test_data_quality.py"
      - "tests/test_report.py"
      - "tests/test_report_numeric.py"
      - "tests/test_consensus_numeric.py"
      - "requirements-ci.txt"
      - ".github/workflows/tests.yml"
  pull_request:
    paths:
      - "app/**"
      - "scripts/data_quality.py"
      - "tests/**"
      - "requirements-ci.txt"

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install (lean — no genomics/browser stack)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt
      - name: Hermetic unit tests — data quality + scoring + consensus
        run: >-
          PYTHONPATH=. pytest -q
          tests/test_data_quality.py
          tests/test_report.py
          tests/test_report_numeric.py
          tests/test_consensus_numeric.py
